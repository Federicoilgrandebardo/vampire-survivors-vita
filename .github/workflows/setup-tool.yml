# Builds the setup tool for Windows, macOS and Linux, each on its own machine: PyInstaller does not
# cross-compile. The tool carries QuickJS (runs the game's own data scripts) and ffmpeg (chest videos),
# so the people using it install nothing.
name: Setup tool

on:
  push:
    paths:
      - "tools/vs_setup.py"
      - "tools/extract_core.js"
      - "sce_sys/icon0.png"
      - ".github/workflows/setup-tool.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: VampireSurvivorsSetup-Windows
          - os: macos-latest
            name: VampireSurvivorsSetup-macOS
          - os: ubuntu-latest
            name: VampireSurvivorsSetup-Linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: pip install pyinstaller quickjs imageio-ffmpeg pillow

      - name: Self-test
        run: |
          python -c "import quickjs, imageio_ffmpeg, os; c = quickjs.Context(); c.eval(open('tools/extract_core.js').read()); assert os.path.isfile(imageio_ffmpeg.get_ffmpeg_exe())"
          python tools/vs_setup.py find

      - name: Build
        run: |
          SEP=":"; ICON=sce_sys/icon0.png
          if [ "$RUNNER_OS" = "Windows" ]; then
            SEP=";"; ICON=vs_setup.ico
            python -c "from PIL import Image; Image.open('sce_sys/icon0.png').convert('RGBA').save('vs_setup.ico', sizes=[(128,128),(64,64),(48,48),(32,32),(16,16)])"
          fi
          pyinstaller --onefile --windowed --name ${{ matrix.name }} --icon "$ICON" \
            --add-data "tools/extract_core.js${SEP}." --collect-binaries imageio_ffmpeg --collect-all quickjs tools/vs_setup.py

      # A zip with a README travels better than a bare .exe: browsers warn less and whoever gets it can find the repo.
      - name: Package for Windows
        if: runner.os == 'Windows'
        run: |
          cp tools/README-setup.txt dist/README.txt
          cd dist && 7z a ${{ matrix.name }}.zip ${{ matrix.name }}.exe README.txt && rm ${{ matrix.name }}.exe README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
